name: ${PROJECT_NAME}-angular

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ${PROJECT_NAME}-angular-app
    restart: always
    env_file:
      - .env
    volumes:
      - ./volume/app/src:/app
    networks:
      - template-network

  caddy:
    image: caddy:2-alpine
    container_name: ${PROJECT_NAME}-angular-caddy
    restart: always
    volumes:
      - ./volume/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./volume/caddy/data:/data
    networks:
      - template-network
    depends_on:
      - app

networks:
  template-network:
    external: true
    name: ${PROJECT_NAME}-network
